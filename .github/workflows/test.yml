name: Test and Lint

on:
  push:
    branches: [main, develop]
  # develop entra aqui porque e onde as features sao mergeadas. Sem isso, PR
  # para develop rodava so lint/type-check/build (ci.yml) e os testes so
  # executavam DEPOIS do merge — foi assim que dois providers nao exportados
  # (TRA-154) chegaram ao release do v1.6.0 e derrubaram o deploy.
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint:check

      - name: Run tests
        run: bun run test