# Varredura de segredos no diff de cada PR (TRA-215).
#
# Barra chave, token ou senha que entra num commit novo, antes do merge.
# Olha só os commits do PR, não o histórico inteiro: o histórico antigo
# ainda tem um vazamento conhecido (achado F4 da auditoria de 26/09), que
# se resolve revogando a credencial e, se o repositório seguir público,
# com `git filter-repo` — não com um CI que falha para sempre.
#
# gitleaks pela imagem oficial: a action do gitleaks exige licença em
# repositório de organização; a CLI, não.
name: secret-scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git /repo \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact \
            --no-banner \
            --exit-code 1
