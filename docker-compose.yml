# Use root/example as user/password credentials
services:
  api:
    build: .
    container_name: trakker-server
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    # Bind explicito em 127.0.0.1: a aplicacao alcanca o banco pela rede
    # interna do compose (host `mongo`), e a porta no host existe so para
    # ferramenta local — Compass, mongosh, dump.
    #
    # `"27017:27017"` publicava em 0.0.0.0. Publicar porta no Docker NAO
    # respeita o ufw: as regras entram na cadeia DOCKER do iptables, avaliada
    # antes das do ufw. Um `ufw deny 27017` no host nao fechava nada, e o
    # banco respondia para a internet com apenas a senha de root na frente.
    #
    # Mesmo motivo pelo qual o redis abaixo nao publica porta nenhuma.
    ports:
      - "127.0.0.1:27017:27017"

  # Fila duravel de eventos (TRA-136). Sidecar no proprio VPS do Coolify:
  # aqui o custo e RAM, nao assinatura de servico gerenciado.
  #
  # `appendonly yes` porque a fila guarda trabalho ainda nao executado — um
  # restart do container nao pode apagar notificacao pendente. `everysec`
  # troca ate 1s de fsync por vazao, aceitavel: o pior caso e reprocessar,
  # e todo consumidor e idempotente por contrato.
  #
  # `maxmemory-policy noeviction` e deliberado: com `allkeys-lru` o Redis
  # descartaria job silenciosamente sob pressao de memoria. Preferimos que a
  # escrita falhe alto — o adaptador degrada para 'unavailable' e loga.
  #
  # Sem `ports:` de proposito — o Redis so precisa ser alcancavel pela rede
  # interna do compose. Publicar 6379 no host expoe a fila a internet.
  redis:
    image: redis:7-alpine
    container_name: trakker-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
  uploads_data:
  redis_data:
