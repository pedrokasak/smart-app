# Alertas do Trackerr (TRA-222 F1d). Ponto de contato: ver README.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "trackerr",
      "folder": "Trackerr",
      "interval": "1m",
      "rules": [
        {
          "uid": "api-5xx",
          "title": "API com mais de 5% de erro 5xx",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical",
            "team": "trackerr"
          },
          "annotations": {
            "summary": "{{ $labels.service_name }} respondeu mais de 5% de 5xx nos últimos 5 minutos."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~\"5..\"}[5m])) / clamp_min(sum by (service_name) (rate(http_server_duration_milliseconds_count[5m])), 1e-9)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "api-p95",
          "title": "API com p95 acima de 2s",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning",
            "team": "trackerr"
          },
          "annotations": {
            "summary": "{{ $labels.service_name }} com p95 acima de 2s por 10 minutos."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_duration_milliseconds_bucket[5m])))",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        2000
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vps-memory",
          "title": "VPS com menos de 10% de memória livre",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical",
            "team": "trackerr"
          },
          "annotations": {
            "summary": "Memória disponível da VPS abaixo de 10%. A VPS já caiu por falta de memória (28/09)."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(system_memory_usage_bytes{state=~\"free|cached|buffered\"}) / sum(system_memory_usage_bytes)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        0.1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vps-disk",
          "title": "Disco da VPS acima de 85%",
          "condition": "C",
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning",
            "team": "trackerr"
          },
          "annotations": {
            "summary": "Disco da VPS acima de 85%: backups locais e logs param de gravar quando enche."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(system_filesystem_usage_bytes{state=\"used\"}) / sum(system_filesystem_usage_bytes)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.85
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "container-memory",
          "title": "Container acima de 90% da memória",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning",
            "team": "trackerr"
          },
          "annotations": {
            "summary": "{{ $labels.container_name }} usando mais de 90% da memória permitida."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max by (container_name) ({__name__=~\"container_memory_percent(_ratio)?\"})",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        90
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
